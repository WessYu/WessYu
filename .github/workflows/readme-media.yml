name: Generate README media

on:
  push:
    branches: [main]
    paths:
      - scripts/generate_readme_media.py
      - .github/workflows/readme-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/generate_readme_media.py
      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme-assets
          if git diff --cached --quiet; then
            echo "README assets already up to date."
            exit 0
          fi
          git commit -m "docs: generate README media [skip ci]"
          git push
