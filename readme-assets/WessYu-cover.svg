<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">WessYu — Software Developer</title>
  <desc id="desc">GitHub profile banner for WessYu, focused on software development, developer tooling, performance and application security.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090c"/>
      <stop offset=".55" stop-color="#0b0e12"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151a"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8b98a6" stroke-opacity=".04"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#76808b}
      .soft{fill:#aeb6bf}
      .white{fill:#f2f4f6}
    </style>
  </defs>

  <rect width="1440" height="420" fill="url(#bg)"/>
  <rect width="1440" height="420" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="96" y="58" width="1248" height="304" rx="18" fill="url(#panel)" stroke="#303740"/>
    <rect x="96" y="58" width="1248" height="46" rx="18" fill="#12171c"/>
    <path d="M96 104h1248" stroke="#252c33"/>
    <circle cx="120" cy="81" r="5.5" fill="#ff5f57"/>
    <circle cx="139" cy="81" r="5.5" fill="#febc2e"/>
    <circle cx="158" cy="81" r="5.5" fill="#28c840"/>

    <text x="116" y="146" class="mono muted" font-size="15">$ whoami</text>
    <text x="116" y="205" class="sans white" font-size="48" font-weight="750" letter-spacing="1.2">WESSYU</text>
    <text x="116" y="238" class="mono soft" font-size="18">software developer</text>

    <text x="116" y="284" class="mono white" font-size="18">&gt; interfaces · tooling · performance · security</text>
    <text x="116" y="320" class="mono muted" font-size="14">React / TypeScript · Node.js · PostgreSQL · CI</text>

    <line x1="870" y1="130" x2="870" y2="326" stroke="#2c343c"/>

    <text x="906" y="146" class="mono muted" font-size="12" letter-spacing="1.4">SYSTEMS I BUILD</text>

